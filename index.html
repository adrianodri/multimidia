<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Acesso - Login</title>
    <style>
        /* [Manter todos os estilos originais...] */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('file:///C:/SISTEMA%20DE%20CONTROLE%20DE%20ACESSO/anima/tecnologia.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
        }
        .header-container {
            width: 47cm;
            margin: 0 auto;
            position: sticky;
            top: 0;
            z-index: 3;
            overflow: hidden;
        }
        .header-image {
            width: 47cm;
            height: 1cm;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('file:///C:/SISTEMA%20DE%20CONTROLE%20DE%20ACESSO/Temas/barrapreta.jpg');
            background-size: 47cm 1cm;
            color: white;
            font-weight: bold;
            text-align: center;
            margin: 0 auto;
            position: relative;
        }
        .moving-text {
            position: absolute;
            white-space: nowrap;
            left: 100%;
            animation: moveText 60s linear infinite;
            opacity: 0;
        }
        .moving-text:nth-child(1) {
            animation-delay: 0s;
        }
        .moving-text:nth-child(2) {
            animation-delay: 15s;
        }
        .moving-text:nth-child(3) {
            animation-delay: 30s;
        }
        .moving-text:nth-child(4) {
            animation-delay: 45s;
        }
        @keyframes moveText {
            0% {
                left: 100%;
                opacity: 0;
            }
            1% {
                opacity: 1;
            }
            24% {
                opacity: 1;
            }
            25% {
                left: 0;
                opacity: 0;
                transform: translateX(-100%);
            }
            100% {
                left: 0;
                opacity: 0;
                transform: translateX(-100%);
            }
        }
        .banner-container {
            width: 47cm;
            margin: 0 auto;
            position: sticky;
            top: 1cm;
            z-index: 2;
            display: flex;
            align-items: center;
        }
        .banner {
            width: 47cm;
            height: 2cm;
            object-fit: fill;
            margin: 0 auto;
        }
        .left-side-content {
            display: flex;
            align-items: center;
            position: absolute;
            left: 5mm;
            z-index: 4;
        }
        .sti-logo {
            width: 57px;
            height: 57px;
            margin-right: 0;
        }
        .client-text {
            width: 223px;
            height: 57px;
            margin-right: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
            font-size: 12px;
        }
        .client-text div {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .client-text div:first-child {
            font-size: 12px;
            margin-bottom: 2px;
        }
        .client-text div:nth-child(2) {
            font-size: 11px;
            letter-spacing: -0.2px;
            margin-bottom: 2px;
        }
        .client-text div:last-child {
            font-size: 10px;
            letter-spacing: -0.1px;
        }
        .portaria-rect {
            width: 130px;
            height: 28px;
            margin-right: 5px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: black;
            animation: piscar 1s infinite;
        }
        @keyframes piscar {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .config-button {
            width: 100px;
            height: 28px;
            background-color: rgba(255, 255, 255, 0.4);
            color: black;
            border: none;
            padding: 0;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            margin-right: 2px;
        }
        .config-button:hover {
            background-color: white;
            color: black;
        }
        .botao-aceso {
            background-color: white !important;
            color: black !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        
        /* [Manter os estilos do popup de login...] */
        .login-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-popup {
            width: 400px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: url('file:///C:/SISTEMA%20DE%20CONTROLE%20DE%20ACESSO/anima/efeito.gif');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .login-header {
            background-color: rgba(0, 0, 0, 0.7);
            color: yellow;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            text-transform: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .login-body {
            padding: 25px;
            color: white;
            position: relative;
        }
        .login-form-group {
            margin-bottom: 20px;
        }
        .login-form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-transform: none;
            font-size: 14px;
        }
        .login-form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 14px;
            text-transform: none;
            transition: all 0.3s ease;
        }
        .login-form-group input:focus {
            border-color: #1F45FC;
            outline: none;
            box-shadow: 0 0 8px rgba(31, 69, 252, 0.6);
            background-color: rgba(0, 0, 0, 0.9);
        }
        .login-footer {
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .login-button {
            padding: 10px 25px;
            background-color: #1F45FC;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: none;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .login-button:hover {
            background-color: #0D35D4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .error-message {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.9);
            text-transform: none;
            font-size: 13px;
        }
    </style>
</head>

<script>
// Esconde o caminho do arquivo e define o título
function hideFilePath() {
    try {
        // Para navegadores modernos
        history.replaceState({}, "Controle de Acesso/Login", "#");
        document.title = "Controle de Acesso/Login";
        
        // Para IE e navegadores antigos
        if (!history.replaceState) {
            window.location.hash = "#";
        }
    } catch(e) {
        console.log("Não foi possível alterar a URL: ", e);
    }
}

// Executa quando a página carrega
window.onload = function() {
    hideFilePath();
    
    // Monitora mudanças de hash para manter a URL limpa
    window.onhashchange = function() {
        if(window.location.hash !== "#") {
            hideFilePath();
        }
    };
};

// Impede que o usuário veja o caminho ao atualizar
window.onbeforeunload = function() {
    hideFilePath();
};
</script>

<body>
    <div class="header-container">
        <div class="header-image" id="moving-text-container">
            <!-- As mensagens serão carregadas dinamicamente via JavaScript -->
        </div>
    </div>
    <div class="banner-container">
        <div class="left-side-content">
            <img src="file:///C:/SISTEMA%20DE%20CONTROLE%20DE%20ACESSO/Temas/STILogo.png" alt="STI Logo" class="sti-logo">
            <div class="client-text">
                <div>Suporte Tecnico Informatica</div>
                <div>HARDWARE E PROGRAMAÇÃO</div>
                <div>CNPJ: 51.529.892/0001-53</div>
            </div>
            <div class="portaria-rect">PORTARIA</div>
            <button class="config-button" id="inicioButton">Inicio</button>
            <button class="config-button" id="registroButton">Registro</button>
            <button class="config-button" id="relatorioButton">Relatorio</button>
            <button class="config-button" id="dashboardButton">Operador</button>
            <button class="config-button" id="suporteButton">Suporte</button>
            <button class="config-button" id="ajudaButton">Ajuda</button>
            <button class="config-button" id="configButton">Configurar</button>
        </div>
        <img src="file:///C:/SISTEMA%20DE%20CONTROLE%20DE%20ACESSO/Temas/marcoazulescuro.jpg" alt="Banner" class="banner">
    </div>

    <!-- Popup de Login com GIF animado totalmente visível -->
    <div class="login-popup-overlay">
        <div class="login-popup">
            <div class="login-header">
                Entre com suas credênciais
            </div>
            <div class="login-body">
                <div class="login-form-group">
                    <label for="login">Login:</label>
                    <input type="text" id="login" placeholder="Digite seu login">
                </div>
                <div class="login-form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>
                <div class="error-message" id="error-message"></div>
            </div>
            <div class="login-footer">
                <button class="login-button" id="entrar-button">Entrar</button>
            </div>
        </div>
    </div>

    <script>
        // Função para carregar as mensagens de um arquivo de texto
        function carregarMensagens() {
            // Caminho para o arquivo de texto com as mensagens
            const caminhoArquivo = 'mensagens.txt';
            
            // Faz uma requisição para carregar o arquivo
            fetch(caminhoArquivo)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erro ao carregar o arquivo de mensagens');
                    }
                    return response.text();
                })
                .then(texto => {
                    // Divide o texto em linhas e filtra linhas vazias
                    const mensagens = texto.split('\n').filter(line => line.trim() !== '');
                    
                    // Seleciona o container das mensagens
                    const container = document.getElementById('moving-text-container');
                    
                    // Limpa o container
                    container.innerHTML = '';
                    
                    // Adiciona cada mensagem como um elemento de texto em movimento
                    mensagens.forEach((mensagem, index) => {
                        const elemento = document.createElement('div');
                        elemento.className = 'moving-text';
                        elemento.textContent = mensagem;
                        
                        // Define o atraso de animação com base no índice
                        elemento.style.animationDelay = `${index * 15}s`;
                        
                        container.appendChild(elemento);
                    });
                })
                .catch(error => {
                    console.error('Erro:', error);
                    // Mensagens padrão em caso de erro
                    const mensagensPadrao = [
                        "Sistema de Controle de Acesso ®",
                        "ENTRE COM A LICENÇA PARA PODER UTILIZAR",
                        "FAVOR LIGAR OU CHAMAR NO WHATSAPP: (11) 98888-5579",
                        
                    ];
                    
                    const container = document.getElementById('moving-text-container');
                    container.innerHTML = '';
                    
                    mensagensPadrao.forEach((mensagem, index) => {
                        const elemento = document.createElement('div');
                        elemento.className = 'moving-text';
                        elemento.textContent = mensagem;
                        elemento.style.animationDelay = `${index * 15}s`;
                        container.appendChild(elemento);
                    });
                });
        }

        // Dados de usuários válidos
        const usuariosValidos = {
            "admin": "admin",
            "operador": "operador"
        };

        // Elementos do DOM
        const loginInput = document.getElementById('login');
        const senhaInput = document.getElementById('senha');
        const entrarButton = document.getElementById('entrar-button');
        const errorMessage = document.getElementById('error-message');

        // Função para verificar credenciais
        function verificarCredenciais() {
            const login = loginInput.value;
            const senha = senhaInput.value;

            if (!login) {
                errorMessage.textContent = 'Por favor, digite seu login';
                return;
            }

            if (!senha) {
                errorMessage.textContent = 'Por favor, digite sua senha';
                return;
            }

            const usuarioEncontrado = Object.keys(usuariosValidos).find(
                key => key.toLowerCase() === login.toLowerCase()
            );
            
            if (usuarioEncontrado && usuariosValidos[usuarioEncontrado] === senha) {
                const novaJanela = window.open('inicio.html', '_blank');
                if (novaJanela) {
                    novaJanela.focus();
                }
                window.close();
            } else {
                errorMessage.textContent = 'Credenciais inválidas. Verifique seu login e senha.';
                senhaInput.value = '';
                loginInput.focus();
            }
        }

        // Evento de clique no botão Entrar
        entrarButton.addEventListener('click', verificarCredenciais);

        // Evento de pressionar Enter nos campos
        loginInput.addEventListener('keypress', function(evento) {
            if (evento.key === 'Enter') {
                verificarCredenciais();
            }
        });

        senhaInput.addEventListener('keypress', function(evento) {
            if (evento.key === 'Enter') {
                verificarCredenciais();
            }
        });

        // Efeito de sequência de botões
        const botoes = [
            document.getElementById('inicioButton'),
            document.getElementById('registroButton'),
            document.getElementById('relatorioButton'),
            document.getElementById('dashboardButton'),
            document.getElementById('suporteButton'),
            document.getElementById('ajudaButton'),
            document.getElementById('configButton')
        ];

        let indiceAtual = 0;
        const tempoAcendido = 1000; // 1 segundo aceso
        const tempoApagado = 500;  // 0.5 segundos entre botões

        function acenderProximoBotao() {
            // Remove a classe 'aceso' de todos os botões
            botoes.forEach(botao => botao.classList.remove('botao-aceso'));
            
            // Adiciona a classe 'aceso' ao botão atual
            botoes[indiceAtual].classList.add('botao-aceso');
            
            // Avança para o próximo botão (ou volta ao primeiro)
            indiceAtual = (indiceAtual + 1) % botoes.length;
            
            // Agenda o próximo passo
            setTimeout(() => {
                botoes[(indiceAtual - 1 + botoes.length) % botoes.length].classList.remove('botao-aceso');
                setTimeout(acenderProximoBotao, tempoApagado);
            }, tempoAcendido);
        }

        // Inicia o efeito quando a página carrega
        window.addEventListener('load', function() {
            loginInput.focus();
            carregarMensagens(); // Carrega as mensagens do arquivo externo
            setTimeout(acenderProximoBotao, 1000); // Começa após 1 segundo
        });
    </script>
</body>
</html>
